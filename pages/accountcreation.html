<html>
<body>

<h1> Please log in here. </h1>

<label for = "login-username">Enter Your Username</label>
<br>
<input type = "text" id = "login-username" name = "Username">
<br>
<label for = "login-password">Enter Your Password</label>
<br>
<input type = "Password" id = "login-password" name = "Password">
<br>
<a href = "https://mwb8170.github.io/foodforall/"><button onclick="setTempCookie()"> Login </button></a>
<br>
<br>
<h2> Don't have an account? Create one here. </h2>
<br>
<br>
<label for = "create-username">Enter Your Username</label>
<br>
<input type = "text" id = "create-username" name = "Username">
<br>
<label for = "create-password">Enter Your Password</label>
<br>
<input type = "Password" id = "create-password" name = "Password">
<br>
<a href = "https://mwb8170.github.io/foodforall/"><button onclick="setCreateCookie()"> Create Account </button></a>

<button onclick="history.back()">Go Back</button>


<script>
 function setTempCookie() {

    document.cookie = "savedUsername=" + document.getElementById("login-username").value + "; path=/";
    document.cookie = "savedPassword=" + document.getElementById("login-password").value + "; path=/";

 }

 function setCreateCookie() {

    document.cookie = "savedUsername=" + document.getElementById("create-username").value + "; path=/";
    document.cookie = "savedPassword=" + document.getElementById("create-password").value + "; path=/";

 }
</script>

</body>
</html>
